name: Build VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone JUCE (Stable Version)
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -G Xcode

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release

      - name: Upload VST3 (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: VST3-Windows
          path: build/LoFiTapeSimulator_artefacts/Release/VST3/*.vst3

      - name: Upload VST3 (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: VST3-macOS
          path: build/LoFiTapeSimulator_artefacts/Release/VST3/*.vst3
