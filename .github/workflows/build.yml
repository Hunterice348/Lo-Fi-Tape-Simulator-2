name: Build VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-26  # Явно указываем macOS 26, избегая неопределенности macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone JUCE (Latest Stable)
        run: |
          # Используем последнюю стабильную версию, которая уже исправила совместимость с Xcode 26
          git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        # Больше не указываем -G, позволяя CMake автоматически выбрать установленную VS 2026
        run: cmake -B build -A x64

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        # Явно указываем архитектуру и минимальную версию системы для повышения совместимости
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release

      - name: Upload VST3 (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: VST3-Windows
          # Используем подстановочные знаки, чтобы избежать сбоя из-за различий в путях
          path: build/**/VST3/*.vst3

      - name: Upload VST3 (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: VST3-macOS
          path: build/**/VST3/*.vst3
