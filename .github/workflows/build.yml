name: Build VST3 Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Установка зависимостей для Linux (для Windows и macOS не требуется)
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
          libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev \
          libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev \
          mesa-common-dev

    # Настройка CMake (JUCE скачается автоматически благодаря FetchContent)
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    # Сборка
    - name: Build
      run: cmake --build build --config Release

    # Загрузка готового VST3 как артефакта
    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LoFiTapeSimulator-${{ runner.os }}
        path: build/LoFiTapeSimulator_artefacts/Release/VST3/
